name: 'Update Python Package'

on:
  workflow_call:
    inputs:
      python_version:
        default: '3.14'
        required: false
        type: string
      runs-on:
        description: >-
          Runner label, or a JSON array of labels that must all match
          (e.g. '["self-hosted", "Linux"]'). When set, it is respected as-is
          (no fallback). When empty (the default), the workflow prefers a
          self-hosted runner and, with a runner_admin_token, falls back to
          ubuntu-latest when none is idle.
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: "Timeout (minutes) for the package-update job"
        type: number
        required: false
        default: 10
      pin_review:
        description: >-
          Review version pins / constraints in pyproject.toml (see
          .github/scripts/review_pins.py) and put the report in the PR body.
          Non-fatal: it never blocks the dependency update.
        type: boolean
        required: false
        default: true
      pin_review_test_command:
        description: >-
          Shell command that runs the project's tests (e.g. "uv run pytest -x
          tests"). When set, each pin that is holding a package back is tested
          against the relaxed resolution to say whether it is still needed.
          Defaults to the shared "test-only" target from common.mk; if the
          repo has no such target the tests are skipped and the report only
          says which pins hold a package back. A baseline run must pass first.
          Raise timeout-minutes if the tests are slow.
        type: string
        required: false
        default: "make test-only"
      pin_review_refresh:
        description: >-
          Ignore the recorded "reviewed:" results and re-test every pin. Use it
          after fixing code that a pin was working around.
        type: boolean
        required: false
        default: false
    secrets:
      runner_admin_token:
        description: >-
          Token with the org "Self-hosted runners: read" permission. When set,
          the job runs on the preferred (self-hosted) runner only if one is
          idle, falling back to ubuntu-latest instead of queueing. When
          absent, runs-on is used as-is.
        required: false
      pipy_registry_auth:
        required: false
      checkout_token:
        required: true
      env_base64:
        required: false

# Opens an automated PR; needs write on contents + pull-requests.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Prefer the self-hosted runner but never block on it: with a
  # runner_admin_token, fetch all registered runners and route to the
  # preferred one only when an idle runner matching every preferred label
  # exists, else fall back to ubuntu-latest. Without the token (or when the
  # preferred runner is not self-hosted, or the API fails), keep the
  # caller's runs-on unchanged.
  pick-runner:
    # Cancel the same job from an older run on the same branch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pick-runner
      cancel-in-progress: true
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - id: pick
        env:
          RUNNER_ADMIN_TOKEN: ${{ secrets.runner_admin_token }}
          PREFERRED: ${{ inputs.runs-on }}
        run: |
          case "$PREFERRED" in
            "") preferred_json='["self-hosted"]' ;;
            \[*) preferred_json="$PREFERRED" ;;
            *) preferred_json="[\"$PREFERRED\"]" ;;
          esac
          echo "preferred runner: $preferred_json"
          if [ -n "$PREFERRED" ]; then
            echo "caller specified runs-on explicitly; using it as-is (no fallback)"
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$RUNNER_ADMIN_TOKEN" ]; then
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0
          fi
          resp=$(curl -sf -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/actions/runners?per_page=100") \
            || { echo "::warning::runner API check failed, keeping preferred runner"; echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "registered self-hosted runners:"
          echo "$resp" | jq -r '.runners[] | "  \(.name)\t[\([.labels[].name] | join(","))]\tstatus=\(.status)\tbusy=\(.busy)"'
          # package-update runs on a monthly cron that fires in every repo at the
          # same minute, so self-hosted runners are usually all BUSY at once.
          # Prefer self-hosted whenever one is ONLINE (queue if busy) rather than
          # stampeding onto GitHub-hosted runners; only fall back to ubuntu-latest
          # when NO self-hosted runner carrying every preferred label is online.
          online=$(echo "$resp" | jq --argjson want "$preferred_json" \
            '[.runners[]
              | select(.status == "online")
              | ([.labels[].name] | map(ascii_downcase)) as $have
              | select($want | map(ascii_downcase) | all(. as $l | $have | index($l)))
             ] | length')
          echo "online runners matching $preferred_json: ${online:-0} (queue if all busy)"
          if [ "${online:-0}" -ge 1 ]; then
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"
          else
            echo "no online self-hosted runner; falling back to ubuntu-latest"
            echo 'runs-on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # This workflow contains a single job called "build"
  package-update:
    # Cancel the same job from an older run on the same branch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-package-update
      cancel-in-progress: true
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      env_base64: ${{ secrets.env_base64 }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.checkout_token }}
          persist-credentials: false
      - name: View context attributes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: console.log(context)
      - name: Setup ENV
        if: ${{ env.env_base64 != '' }}
        run: echo "$env_base64" | base64 -d > .env && source .env
      # uv provisions both itself and the Python interpreter on every runner
      # (hosted and self-hosted), so workflows never depend on the machine's Python.
      # Python version resolution: if pyproject.toml declares requires-python,
      # leave python-version empty so uv resolves it from there; otherwise fall
      # back to the python_version workflow input.
      - name: Resolve Python version source
        id: pyver
        env:
          PYTHON_VERSION_INPUT: ${{ inputs.python_version }}
        run: |
          if [ -f pyproject.toml ] && grep -Eq '^\s*requires-python\s*=' pyproject.toml; then
            echo "pyproject.toml declares requires-python; letting uv resolve it"
            echo "python-version=" >> "$GITHUB_OUTPUT"
          else
            echo "no requires-python found; using fallback python version $PYTHON_VERSION_INPUT"
            echo "python-version=$PYTHON_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ steps.pyver.outputs.python-version }}
          # Wheel cache keyed on uv.lock; hosted runners only -- self-hosted
          # machines already keep a warm local uv cache, and round-tripping it
          # through the Actions cache would only add transfer time.
          enable-cache: ${{ runner.environment != 'self-hosted' }}
      - name: Pull pre-commit config
        run: |
          curl -O https://raw.githubusercontent.com/tryagainconcepts/reusable-github-workflows/main/.pre-commit-config.yaml
          curl -O https://raw.githubusercontent.com/tryagainconcepts/reusable-github-workflows/main/common.mk
      - name: install package
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          # Mask the split halves so they can't surface in logs (the combined
          # secret is masked by GitHub, but the parsed parts are not).
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          uv venv
          uv lock --upgrade
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: Init PR body
        run: echo "Automated dependency update (\`uv lock --upgrade\`)." > "$RUNNER_TEMP/pr-body.md"
      # Relax each pin in a scratch copy and see whether it still holds a package
      # back. The script is fetched from main (like the files above) so consumer
      # repos need no copy. Never fails the update: a broken review only costs
      # the report, and the 5 minute cap keeps it from eating the job timeout.
      - name: Review pins
        if: ${{ inputs.pin_review }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          curl -fsSL -o "$RUNNER_TEMP/review_pins.py" \
            https://raw.githubusercontent.com/tryagainconcepts/reusable-github-workflows/main/.github/scripts/review_pins.py
          # --write records "reviewed: <date> against <version> -> <verdict>" in
          # each pin's comment block; the PR step below commits that edit.
          args=(--write --summary "$RUNNER_TEMP/pin-review.md")
          if [ "$PIN_REFRESH" = "true" ]; then args+=(--refresh); fi
          if [ "$PIN_TEST_COMMAND" = "make test-only" ] && ! make -n test-only >/dev/null 2>&1; then
            echo "no test-only make target; skipping pin tests"; PIN_TEST_COMMAND=""
          fi
          if [ -n "$PIN_TEST_COMMAND" ]; then args+=(--test-cmd "$PIN_TEST_COMMAND"); fi
          uv run --no-project "$RUNNER_TEMP/review_pins.py" "${args[@]}"
          { echo; cat "$RUNNER_TEMP/pin-review.md"; } >> "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pin-review.md" >> "$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
          PIN_TEST_COMMAND: ${{ inputs.pin_review_test_command }}
          PIN_REFRESH: ${{ inputs.pin_review_refresh }}
      - name: format code
        run: |
          make format
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: main
          token: ${{ secrets.checkout_token }}
          # Fixed head branch so the CI run this PR triggers can reliably detect
          # it (pick-runner keys off github.head_ref, which -- unlike the labels
          # below -- is present on the initial "opened" event) and prefer the
          # self-hosted fleet over GitHub-hosted for the monthly fan-out.
          branch: automated/package-update
          # Conventional Commit title + message so the PR passes the
          # Conventional-Commits check and release-please can parse the merged
          # commit (it auto-merges with MERGE, so the commit message matters as
          # much as the title). Use "fix(deps)" (a patch-level release) rather
          # than "chore(deps)": a chore alone is not releasable, so release-please
          # would open no release PR and the release-please loud-fail would trip
          # on the post-merge main run -- and the refreshed deps would never be
          # published. "fix(deps)" cuts a patch so the update actually ships.
          title: 'fix(deps): update python dependencies'
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: 'fix(deps): update python dependencies'
          labels: |
            automated
            automerge
        if: always()
      # "Allow auto-merge" in repo settings only makes the feature available; it
      # must still be enabled per PR, and nobody clicks the button on automated
      # PRs. Enable it here so GitHub merges once required checks pass.
      # (Needs a ruleset/branch protection with required status checks on the base
      # branch; without one GitHub refuses to enable auto-merge.)
      - name: Enable auto-merge
        if: always() && steps.cpr.outputs.pull-request-operation == 'created'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          # Same PAT that opened the PR; GITHUB_TOKEN cannot enable auto-merge on it.
          github-token: ${{ secrets.checkout_token }}
          script: |
            const number = Number("${{ steps.cpr.outputs.pull-request-number }}");
            const { owner, repo } = context.repo;
            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){
                 repository(owner:$owner,name:$repo){ pullRequest(number:$number){ id } } }`,
              { owner, repo, number });
            try {
              await github.graphql(
                `mutation($id:ID!){ enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:MERGE}){ clientMutationId } }`,
                { id: repository.pullRequest.id });
              core.info(`Auto-merge enabled on PR #${number}`);
            } catch (err) {
              core.warning(`Could not enable auto-merge on PR #${number}: ${err.message} ` +
                `(is "Allow auto-merge" on and does the base branch require status checks?)`);
            }
