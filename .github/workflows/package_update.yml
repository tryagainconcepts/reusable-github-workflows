name: 'Update Python Package'

on:
  workflow_call:
    inputs:
      python_version:
        default: '3.14'
        required: false
        type: string
      runs-on:
        description: >-
          Runner label, or a JSON array of labels that must all match
          (e.g. '["self-hosted", "Linux"]').
        type: string
        required: false
        default: self-hosted
      timeout-minutes:
        description: "Timeout (minutes) for the package-update job"
        type: number
        required: false
        default: 10
    secrets:
      runner_admin_token:
        description: >-
          Token with the org "Self-hosted runners: read" permission. When set,
          the job runs on the preferred (self-hosted) runner only if one is
          idle, falling back to ubuntu-latest instead of queueing. When
          absent, runs-on is used as-is.
        required: false
      pipy_registry_auth:
        required: false
      checkout_token:
        required: true
      env_base64:
        required: false

# Opens an automated PR; needs write on contents + pull-requests.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Prefer the self-hosted runner but never block on it: with a
  # runner_admin_token, fetch all registered runners and route to the
  # preferred one only when an idle runner matching every preferred label
  # exists, else fall back to ubuntu-latest. Without the token (or when the
  # preferred runner is not self-hosted, or the API fails), keep the
  # caller's runs-on unchanged.
  pick-runner:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - id: pick
        env:
          RUNNER_ADMIN_TOKEN: ${{ secrets.runner_admin_token }}
          PREFERRED: ${{ inputs.runs-on }}
        run: |
          case "$PREFERRED" in
            \[*) preferred_json="$PREFERRED" ;;
            *) preferred_json="[\"$PREFERRED\"]" ;;
          esac
          echo "preferred runner: $preferred_json"
          if [ -z "$RUNNER_ADMIN_TOKEN" ] || ! echo "$preferred_json" | grep -q "self-hosted"; then
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0
          fi
          resp=$(curl -sf -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/actions/runners?per_page=100") \
            || { echo "::warning::runner API check failed, keeping preferred runner"; echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "registered self-hosted runners:"
          echo "$resp" | jq -r '.runners[] | "  \(.name)\t[\([.labels[].name] | join(","))]\tstatus=\(.status)\tbusy=\(.busy)"'
          # count idle runners that carry EVERY preferred label (case-insensitive),
          # so '["self-hosted", "Linux"]' does not match an idle macOS runner
          idle=$(echo "$resp" | jq --argjson want "$preferred_json" \
            '[.runners[]
              | select(.status == "online" and .busy == false)
              | ([.labels[].name] | map(ascii_downcase)) as $have
              | select($want | map(ascii_downcase) | all(. as $l | $have | index($l)))
             ] | length')
          echo "idle runners matching $preferred_json: ${idle:-0}"
          if [ "${idle:-0}" -ge 1 ]; then
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"
          else
            echo 'runs-on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  # This workflow contains a single job called "build"
  package-update:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      env_base64: ${{ secrets.env_base64 }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.checkout_token }}
          persist-credentials: false
      - name: View context attributes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: console.log(context)
      - name: Setup ENV
        if: ${{ env.env_base64 != '' }}
        run: echo "$env_base64" | base64 -d > .env && source .env
      # uv provisions both itself and the Python interpreter on every runner
      # (hosted and self-hosted), so workflows never depend on the machine's Python.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ inputs.python_version }}
          # Wheel cache keyed on uv.lock; hosted runners only -- self-hosted
          # machines already keep a warm local uv cache, and round-tripping it
          # through the Actions cache would only add transfer time.
          enable-cache: ${{ runner.environment != 'self-hosted' }}
      - name: Pull pre-commit config
        run: |
          curl -O https://raw.githubusercontent.com/tryagainconcepts/reusable-github-workflows/main/.pre-commit-config.yaml
          curl -O https://raw.githubusercontent.com/tryagainconcepts/reusable-github-workflows/main/common.mk
      - name: install package
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          # Mask the split halves so they can't surface in logs (the combined
          # secret is masked by GitHub, but the parsed parts are not).
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          uv venv
          uv lock --upgrade
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: format code
        run: |
          make format
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: main
          token: ${{ secrets.checkout_token }}
          title: '[Automated] Update Python Package'
          labels: |
            automated
            automerge
        if: always()
      # "Allow auto-merge" in repo settings only makes the feature available; it
      # must still be enabled per PR, and nobody clicks the button on automated
      # PRs. Enable it here so GitHub merges once required checks pass.
      # (Needs a ruleset/branch protection with required status checks on the base
      # branch; without one GitHub refuses to enable auto-merge.)
      - name: Enable auto-merge
        if: always() && steps.cpr.outputs.pull-request-operation == 'created'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          # Same PAT that opened the PR; GITHUB_TOKEN cannot enable auto-merge on it.
          github-token: ${{ secrets.checkout_token }}
          script: |
            const number = Number("${{ steps.cpr.outputs.pull-request-number }}");
            const { owner, repo } = context.repo;
            const { repository } = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){
                 repository(owner:$owner,name:$repo){ pullRequest(number:$number){ id } } }`,
              { owner, repo, number });
            try {
              await github.graphql(
                `mutation($id:ID!){ enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:MERGE}){ clientMutationId } }`,
                { id: repository.pullRequest.id });
              core.info(`Auto-merge enabled on PR #${number}`);
            } catch (err) {
              core.warning(`Could not enable auto-merge on PR #${number}: ${err.message} ` +
                `(is "Allow auto-merge" on and does the base branch require status checks?)`);
            }
