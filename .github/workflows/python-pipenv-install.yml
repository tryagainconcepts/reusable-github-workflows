name: Python CI Workflow

on:
  workflow_call:
    inputs:
      python_version:
        default: "3.14"
        required: false
        type: string
      test_script:
        required: false
        type: string
      deploy_script:
        required: false
        type: string
      setup_mongo:
        default: false
        required: false
        type: boolean
      pypi_release:
        default: false
        required: false
        type: boolean
      aws_region:
        required: false
        default: "ap-southeast-1"
        type: string
      runs-on:
        type: string
        required: false
        default: self-hosted
      timeout-minutes:
        description: "Timeout (minutes) applied to each job in this workflow"
        type: number
        required: false
        default: 20
      audit_ignore_packages:
        description: >-
          Space-separated package names to exclude from the vulnerability audit
          (e.g. "setuptools"). Use only for a hard-pinned dependency that cannot be
          upgraded; every advisory for that package is silenced, so keep the list short.
        required: false
        default: ""
        type: string
    secrets:
      pipy_registry_auth:
        required: false
      slack_webhook_url:
        description: "notify slack on github action result"
        required: false
      teams_webhook_url:
        description: "notify Microsoft Teams on github action result (incoming webhook URL)"
        required: false
      aws_key_id:
        required: false
      aws_secret:
        required: false
      env_base64:
        required: false

# Least-privilege token: only what the jobs below actually need
# (automerge + tag/changelog commits need write; everything else read).
permissions:
  contents: write
  pull-requests: write

jobs:
  build-test-deploy:
    name: Build Test and Deploy
    runs-on: "${{ inputs.runs-on }}"
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      env_base64: ${{ secrets.env_base64 }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: View context attributes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: console.log(context)
      - name: print build context
        run: |
          echo "repository = $GH_REPOSITORY"
          echo "ref        = $GH_REF"
          echo "actor      = $GH_ACTOR"
          echo "event      = $GH_EVENT_NAME"
          echo "sha        = $GH_SHA"
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_SHA: ${{ github.sha }}
      # uv provisions both itself and the Python interpreter on every runner
      # (hosted and self-hosted), so workflows never depend on the machine's Python.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ inputs.python_version }}
      - name: Pull pre-commit config
        run: |
          curl -O https://raw.githubusercontent.com/tryagainconcepts/reusable-github-workflows/main/.pre-commit-config.yaml
        if: github.ref != 'refs/heads/main'
      - name: Run a one-line script
        run: |
          echo Hello, world!
          echo github ref: ${{ github.ref }}
      # pre-commit/action is maintenance-only; run pre-commit directly via uvx instead.
      - name: Run pre-commit
        run: uvx pre-commit run --show-diff-on-failure --color=always --all-files
      - name: install package
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          make config-test
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: Audit dependencies for known vulnerabilities
        # Audit the locked, fully-pinned dependency set straight from uv.lock —
        # no pip, no re-resolution, no private-registry credentials. Packages
        # not on PyPI are skipped; any installed dependency with a known
        # advisory fails the job.
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project --quiet \
            -o "$RUNNER_TEMP/requirements.txt"
          for pkg in $AUDIT_IGNORE_PACKAGES; do
            echo "::warning::Excluding '$pkg' from vulnerability audit (audit_ignore_packages)"
            # Match "name==", "name[extra]==", "name ==" etc.; package names are case-insensitive
            # and '-'/'_' are interchangeable, so normalise both sides.
            pattern="^$(printf '%s' "$pkg" | sed 's/[-_]/[-_]/g')([[:space:]]|\[|==|$)"
            grep -viE "$pattern" "$RUNNER_TEMP/requirements.txt" > "$RUNNER_TEMP/requirements.filtered" || true
            mv "$RUNNER_TEMP/requirements.filtered" "$RUNNER_TEMP/requirements.txt"
          done
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
        env:
          AUDIT_IGNORE_PACKAGES: ${{ inputs.audit_ignore_packages }}
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        if: inputs.setup_mongo && inputs.runs-on != 'self-hosted'
      - name: Setup ENV
        run: |
          echo "$env_base64" | base64 -d > .env
          cut -d '=' -f 1 .env | sed '/^\s*$/d'
          cat .env >> "$GITHUB_ENV"
          source .env
        if: ${{ env.env_base64 != '' }}
      - name: run test
        if: inputs.test_script
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          ${{ inputs.test_script }}
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}

      # Replaces pascalgn/automerge-action (unmaintained, node20). Same contract:
      # merge open PRs for this commit labelled "automerge" and not "work in progress",
      # and expose mergeResult=merged|skipped|not_merged for the deploy steps below.
      - name: automerge on PR labelled with automerge
        id: automerge
        if: github.ref != 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const REQUIRED = "automerge";
            const BLOCKING = "work in progress";
            const RETRIES = 6;
            const RETRY_SLEEP_MS = 5000;

            let prs;
            if (context.payload.pull_request) {
              prs = [context.payload.pull_request];
            } else {
              ({ data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: context.sha,
              }));
            }
            const candidates = prs.filter((pr) => {
              const labels = pr.labels.map((l) => l.name);
              return pr.state === "open" && labels.includes(REQUIRED) && !labels.includes(BLOCKING);
            });
            if (candidates.length === 0) {
              core.info(`No open PR for ${context.sha} labelled "${REQUIRED}"; skipping.`);
              core.setOutput("mergeResult", "skipped");
              return;
            }

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            let result = "not_merged";
            for (const pr of candidates) {
              for (let attempt = 1; attempt <= RETRIES; attempt++) {
                try {
                  await github.rest.pulls.merge({
                    owner, repo, pull_number: pr.number, merge_method: "merge",
                  });
                  core.info(`Merged PR #${pr.number}`);
                  result = "merged";
                  break;
                } catch (err) {
                  // 405 = not mergeable yet (checks/conflicts), 409 = head moved; retry those.
                  const retryable = err.status === 405 || err.status === 409;
                  core.warning(`PR #${pr.number} merge attempt ${attempt}/${RETRIES} failed: ${err.message}`);
                  if (!retryable || attempt === RETRIES) break;
                  await sleep(RETRY_SLEEP_MS);
                }
              }
            }
            core.setOutput("mergeResult", result);
      - name: switch to main branch
        if: steps.automerge.outputs.mergeResult == 'merged'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Debug deploy conditions
        if: always()
        run: |
          echo "github.ref                 = ${{ github.ref }}"
          echo "endsWith(ref, '/main')     = ${{ endsWith(github.ref, '/main') }}"
          echo "automerge mergeResult       = ${{ steps.automerge.outputs.mergeResult }}"
          echo "inputs.deploy_script set?   = ${{ inputs.deploy_script != '' }}"
          echo "inputs.pypi_release         = ${{ inputs.pypi_release }}"
          echo "deploy step will run?       = ${{ inputs.deploy_script != '' && (endsWith(github.ref, '/main') || steps.automerge.outputs.mergeResult == 'merged') }}"
      - name: deploy
        if: inputs.deploy_script && (endsWith(github.ref, '/main') || steps.automerge.outputs.mergeResult == 'merged')
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          echo "Registry username: $UV_INDEX_PRIVATE_REGISTRY_USERNAME"
          ${{ inputs.deploy_script }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: bumpversion
        if: endsWith(github.ref, '/main') || steps.automerge.outputs.mergeResult == 'merged'
        run: |
          git config --global user.email "bumpversion@example.com"
          git config --global user.name "versionbump"
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          uv version --bump minor
          git add pyproject.toml uv.lock
          git commit -m "Bump version to $(uv version --short)"
          # Self-hosted runners reuse the workspace; a tag left over from a run whose
          # push was rejected would otherwise make `git tag` fail. The push below is
          # non-forced, so a tag that really exists on the remote is still rejected there.
          git tag -d "$(uv version --short)" 2>/dev/null || true
          git tag -a "$(uv version --short)" -m "Release $(uv version --short)"
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: Push new version tag
        if: endsWith(github.ref, '/main') || steps.automerge.outputs.mergeResult == 'merged'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tags: true
      - name: Release pypi on main branch
        if: inputs.pypi_release && (endsWith(github.ref, '/main') || steps.automerge.outputs.mergeResult == 'merged')
        run: |
          make release-s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
      - name: Compose Slack commit summary
        if: always()
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Take the first line only, escape backslashes then double quotes,
          # strip CRs and truncate. Commit messages are attacker-controllable,
          # so this keeps them from breaking out of the JSON payload below.
          MSG="${RAW_COMMIT_MSG%%$'\n'*}"
          MSG="${MSG//\\/\\\\}"
          MSG="${MSG//\"/\\\"}"
          MSG="$(printf '%s' "$MSG" | tr -d '\r')"
          MSG="${MSG:0:160}"
          [ -z "$MSG" ] && MSG="_(no commit message)_"
          printf 'COMMIT_MSG=%s\n' "$MSG" >> "$GITHUB_ENV"
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.slack_webhook_url }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && '✅' || job.status == 'cancelled' && '🚫' || '❌' }} Deploy ${{ job.status }} — ${{ github.repository }}@${{ github.ref_name }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  emoji: true
                  text: "${{ job.status == 'success' && '✅ Deploy Succeeded' || job.status == 'cancelled' && '🚫 Deploy Cancelled' || '❌ Deploy Failed' }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository*\n<https://github.com/${{ github.repository }}|${{ github.repository }}>"
                  - type: "mrkdwn"
                    text: "*Branch*\n`${{ github.ref_name }}`"
                  - type: "mrkdwn"
                    text: "*Author*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Event*\n`${{ github.event_name }}`"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Commit*\n>${{ env.COMMIT_MSG }}"
              - type: "divider"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "Workflow *${{ github.workflow }}*  ·  Run #${{ github.run_number }}  ·  `${{ github.sha }}`"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      emoji: true
                      text: "🔗 View Commit"
                    url: "${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}"
                  - type: "button"
                    text:
                      type: "plain_text"
                      emoji: true
                      text: "📜 View Run"
                    url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify Teams
        if: always()
        env:
          # Prefer the secret; fall back to a repository/org variable of the caller.
          TEAMS_CHANNEL_WEBHOOK_URL: ${{ secrets.teams_webhook_url || vars.TEAMS_CHANNEL_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TEAMS_CHANNEL_WEBHOOK_URL" ]; then
            echo "No Teams webhook configured (secret teams_webhook_url / var TEAMS_CHANNEL_WEBHOOK_URL); skipping."
            exit 0
          fi
          # The URL may come from a plain variable (not auto-masked); anyone with
          # it can post to the channel, so keep it out of the logs.
          echo "::add-mask::$TEAMS_CHANNEL_WEBHOOK_URL"
          # Same content as the Slack message, sent as an HTML *text* message rather
          # than an Adaptive Card: the Teams "webhook -> channel" flow posts text
          # messages through the path that gets a notification preview ("Message
          # has no preview" for cards). Built with Python's json module (jq isn't
          # guaranteed on self-hosted runners) so commit messages etc. cannot
          # break the JSON or inject HTML.
          uv run --no-project python - > "$RUNNER_TEMP/teams-payload.json" <<'PY'
          import html, json, os
          e = os.environ
          h = lambda k: html.escape(e.get(k, ""))
          # First line of the commit message, truncated (same rule as the Slack step).
          commit = e.get("RAW_COMMIT_MSG", "").splitlines()[0:1]
          commit = html.escape((commit[0] if commit else "").strip()[:160]) or "<i>(no commit message)</i>"
          title = {
              "success":   "✅ Deploy Succeeded",
              "cancelled": "🚫 Deploy Cancelled",
          }.get(e["STATUS"], "❌ Deploy Failed")
          summary = f"{title} — {e['REPO']}@{e['REF_NAME']}"
          text = (
              f"<b>{html.escape(title)}</b><br>"
              f"<b>Repository:</b> <a href=\"https://github.com/{h('REPO')}\">{h('REPO')}</a>"
              f" &nbsp;·&nbsp; <b>Branch:</b> <code>{h('REF_NAME')}</code>"
              f" &nbsp;·&nbsp; <b>Author:</b> {h('ACTOR')}"
              f" &nbsp;·&nbsp; <b>Event:</b> <code>{h('EVENT_NAME')}</code><br>"
              f"<b>Commit:</b> {commit}<br>"
              f"<small>Workflow <b>{h('WORKFLOW')}</b> · Run #{h('RUN_NUMBER')} · <code>{h('SHA')}</code></small><br>"
              f"🔗 <a href=\"{h('COMMIT_URL')}\">View Commit</a> &nbsp;·&nbsp; "
              f"📜 <a href=\"{h('RUN_URL')}\">View Run</a>"
          )
          print(json.dumps({"type": "message", "summary": summary, "text": text}))
          PY
          # (--fail-with-body needs curl >= 7.76, which older runners lack; check status manually.)
          HTTP_CODE=$(curl --silent --show-error -o "$RUNNER_TEMP/teams-response.txt" -w '%{http_code}' \
            -X POST -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/teams-payload.json" "$TEAMS_CHANNEL_WEBHOOK_URL")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Teams webhook returned HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/teams-response.txt"; echo
            exit 1
          fi
          echo "Teams notification sent (HTTP $HTTP_CODE)"
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: endsWith(github.ref, '/main')
    needs:
      - build-test-deploy
    steps:
      # Check out the tip of main (includes the version-bump commit the
      # build-test-deploy job just pushed) so the changelog commit is a
      # fast-forward and not a divergent push. fetch-depth: 0 gives the
      # changelog builder full tag history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: View context attributes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: console.log(context)
      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update CHANGELOG.md
        env:
          CHANGELOG_CONTENT: ${{ steps.build_changelog.outputs.changelog }}
        run: |
          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md CHANGELOG.previous.md
          fi

          {
            printf '## %s\n\n' "$(date -u +'%Y-%m-%d')"
            printf '%s\n\n' "$CHANGELOG_CONTENT"
            if [ -f CHANGELOG.previous.md ]; then
              cat CHANGELOG.previous.md
            fi
          } > CHANGELOG.md

          rm -f CHANGELOG.previous.md
      - name: Commit Changelog
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: update changelog [skip ci]"
          file_pattern: CHANGELOG.md
