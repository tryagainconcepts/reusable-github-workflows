name: Python CI Workflow

on:
  workflow_call:
    inputs:
      python_version:
        default: "3.14"
        required: false
        type: string
      test_script:
        required: false
        type: string
      deploy_script:
        required: false
        type: string
      setup_mongo:
        default: false
        required: false
        type: boolean
      pypi_release:
        default: false
        required: false
        type: boolean
      aws_region:
        required: false
        default: "ap-southeast-1"
        type: string
      runs-on:
        description: >-
          Runner label, or a JSON array of labels that must all match
          (e.g. '["self-hosted", "Linux"]'). When set, it is respected as-is
          (no fallback). When empty (the default), the workflow prefers a
          self-hosted runner and, with a runner_admin_token, falls back to
          ubuntu-latest when none is idle.
        type: string
        required: false
        default: ""
      timeout-minutes:
        description: "Timeout (minutes) applied to each job in this workflow"
        type: number
        required: false
        default: 20
      audit_ignore_packages:
        description: >-
          Space-separated package names to exclude from the vulnerability audit
          (e.g. "setuptools"). Use only for a hard-pinned dependency that cannot be
          upgraded; every advisory for that package is silenced, so keep the list short.
        required: false
        default: ""
        type: string
    secrets:
      runner_admin_token:
        description: >-
          Token with the org "Self-hosted runners: read" permission. When set,
          the build job runs on the preferred (self-hosted) runner only if one
          is idle, falling back to ubuntu-latest instead of queueing. When
          absent, runs-on is used as-is.
        required: false
      pipy_registry_auth:
        required: false
      release_please_token:
        description: >-
          Deprecated compatibility secret. Direct releases and automatic merges
          now use GITHUB_TOKEN; this value is no longer used.
        required: false
      slack_webhook_url:
        description: "notify slack on github action result"
        required: false
      teams_webhook_url:
        description: "notify Microsoft Teams on github action result (incoming webhook URL)"
        required: false
      aws_key_id:
        required: false
      aws_secret:
        required: false
      env_base64:
        required: false

# Least-privilege token: only what the jobs below actually need
# (automerge + tag/changelog commits need write; everything else read).
permissions:
  contents: write
  pull-requests: write

jobs:
  # Prefer the self-hosted runner but never block on it: with a
  # runner_admin_token, route to the preferred runner only when an idle
  # self-hosted runner exists, else fall back to ubuntu-latest. Without the
  # token (or when the preferred runner is not self-hosted, or the API
  # fails), keep the caller's runs-on unchanged.
  pick-runner:
    # Cancel the same job from an older run on the same branch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pick-runner
      cancel-in-progress: true
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
    steps:
      - id: pick
        env:
          RUNNER_ADMIN_TOKEN: ${{ secrets.runner_admin_token }}
          PREFERRED: ${{ inputs.runs-on }}
          # True only for the automated package-upgrade PR, whose head branch
          # package_update.yml fixes to "automated/package-update". These all fire
          # on the same monthly cron, so for them we prefer self-hosted whenever
          # one is ONLINE (queue if busy) instead of stampeding onto GitHub-hosted.
          # Keyed off head_ref (present on the initial "opened" event, unlike the
          # PR labels). Human PRs keep the fast path: prefer a FREE runner, fall
          # back to GitHub-hosted when busy.
          IS_AUTOMATED: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'automated/package-update') }}
        run: |
          case "$PREFERRED" in
            "") preferred_json='["self-hosted"]' ;;
            \[*) preferred_json="$PREFERRED" ;;
            *) preferred_json="[\"$PREFERRED\"]" ;;
          esac
          echo "preferred runner: $preferred_json"
          if [ -n "$PREFERRED" ]; then
            echo "caller specified runs-on explicitly; using it as-is (no fallback)"
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$RUNNER_ADMIN_TOKEN" ]; then
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0
          fi
          resp=$(curl -sf -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/actions/runners?per_page=100") \
            || { echo "::warning::runner API check failed, keeping preferred runner"; echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "registered self-hosted runners:"
          echo "$resp" | jq -r '.runners[] | "  \(.name)\t[\([.labels[].name] | join(","))]\tstatus=\(.status)\tbusy=\(.busy)"'
          # Automated package-upgrade PR: count ONLINE runners (busy included) so
          # it queues on the fleet. Otherwise count only FREE (online & not busy)
          # runners so human PRs fall back to GitHub-hosted for fast feedback.
          # Match runners carrying EVERY preferred label (case-insensitive), so
          # '["self-hosted", "Linux"]' does not match an idle macOS runner.
          if [ "$IS_AUTOMATED" = "true" ]; then require_free=false; kind="online"; else require_free=true; kind="free"; fi
          count=$(echo "$resp" | jq --argjson want "$preferred_json" --argjson require_free "$require_free" \
            '[.runners[]
              | select(.status == "online" and ((.busy | not) or ($require_free | not)))
              | ([.labels[].name] | map(ascii_downcase)) as $have
              | select($want | map(ascii_downcase) | all(. as $l | $have | index($l)))
             ] | length')
          echo "$kind runners matching $preferred_json: ${count:-0}$( [ "$IS_AUTOMATED" = "true" ] && echo ' (queue if busy)' )"
          if [ "${count:-0}" -ge 1 ]; then
            echo "runs-on=$preferred_json" >> "$GITHUB_OUTPUT"
          else
            echo 'runs-on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build-test-deploy:
    # Job id/name kept for rulesets that require this status check; it now only
    # builds and tests — merge and deploy live in the jobs below.
    name: Build Test and Deploy
    # A newer push to the same ref supersedes this build; cancel the older run
    # instead of paying for both. This applies on main too, so an intermediate
    # commit's run (and its deploy/release) can be cancelled by a newer push --
    # only the tip of main is built and shipped.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-test
      cancel-in-progress: true
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      env_base64: ${{ secrets.env_base64 }}
    steps:
      # Fail fast on a non-Conventional-Commit PR title. Squash-merges use the
      # PR title as the commit message. The main-only direct release job uses
      # Conventional Commits to calculate version bumps and release notes.
      - name: Lint PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Reruns retain the original event payload, including its old title.
            // Fetch the current PR so a title correction is picked up on rerun.
            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            const title = (pullRequest.title || "").trim();
            const TYPES = "build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test";
            const conventional = new RegExp(`^(${TYPES})(\\([^)]+\\))?!?: .+`);
            if (!conventional.test(title)) {
              core.setFailed(
                `PR title is not a Conventional Commit:\n  "${title}"\n\n` +
                `Squash-merges use the PR title as the commit message, and ` +
                `The direct release job needs Conventional Commits to determine the next version.\n` +
                `Use "<type>: <subject>", e.g. "feat: add X", "fix: correct Y", ` +
                `"chore: bump deps" (optional scope: "feat(admin): ...").\n` +
                `Types: ${TYPES.replace(/\|/g, ", ")}.`
              );
              return;
            }
            // Valid title, but only feat/fix/! actually produce a release.
            const releasing = /^(feat|fix)(\([^)]+\))?: /.test(title) || title.includes("!:");
            if (!releasing) {
              core.notice(
                `Title "${title}" is a valid Conventional Commit but its type ` +
                `won't trigger a release (only feat, fix, or a breaking "!" do). ` +
                `That's fine for non-release changes.`
              );
            }
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: View context attributes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: console.log(context)
      - name: print build context
        run: |
          echo "repository = $GH_REPOSITORY"
          echo "ref        = $GH_REF"
          echo "actor      = $GH_ACTOR"
          echo "event      = $GH_EVENT_NAME"
          echo "sha        = $GH_SHA"
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_SHA: ${{ github.sha }}
      # uv provisions both itself and the Python interpreter on every runner
      # (hosted and self-hosted), so workflows never depend on the machine's Python.
      # Python version resolution: if pyproject.toml declares requires-python,
      # leave python-version empty so uv resolves it from there; otherwise fall
      # back to the python_version workflow input.
      - name: Resolve Python version source
        id: pyver
        env:
          PYTHON_VERSION_INPUT: ${{ inputs.python_version }}
        run: |
          if [ -f pyproject.toml ] && grep -Eq '^\s*requires-python\s*=' pyproject.toml; then
            echo "pyproject.toml declares requires-python; letting uv resolve it"
            echo "python-version=" >> "$GITHUB_OUTPUT"
          else
            echo "no requires-python found; using fallback python version $PYTHON_VERSION_INPUT"
            echo "python-version=$PYTHON_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ steps.pyver.outputs.python-version }}
          # Wheel cache keyed on uv.lock; hosted runners only -- self-hosted
          # machines already keep a warm local uv cache, and round-tripping it
          # through the Actions cache would only add transfer time.
          enable-cache: ${{ runner.environment != 'self-hosted' }}
      # Hosted runners start cold; rebuilding every pre-commit hook
      # environment takes minutes. Self-hosted machines keep a warm local
      # cache already.
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        if: runner.environment != 'self-hosted'

      - name: Pull pre-commit config
        run: |
          curl -O https://raw.githubusercontent.com/tryagainconcepts/reusable-github-workflows/main/.pre-commit-config.yaml
        if: github.ref != 'refs/heads/main'
      - name: Run a one-line script
        run: |
          echo Hello, world!
          echo github ref: ${{ github.ref }}
      # pre-commit/action is maintenance-only; run pre-commit directly via uvx instead.
      - name: Run pre-commit
        run: uvx pre-commit run --show-diff-on-failure --color=always --all-files
        env:
          UV_PYTHON: ${{ inputs.python_version }}
      - name: install package
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          make config-test
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: Audit dependencies for known vulnerabilities
        # Audit the locked, fully-pinned dependency set straight from uv.lock —
        # no pip, no re-resolution, no private-registry credentials. Packages
        # not on PyPI are skipped; any installed dependency with a known
        # advisory fails the job.
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project --quiet \
            -o "$RUNNER_TEMP/requirements.txt"
          for pkg in $AUDIT_IGNORE_PACKAGES; do
            echo "::warning::Excluding '$pkg' from vulnerability audit (audit_ignore_packages)"
            # Match "name==", "name[extra]==", "name ==" etc.; package names are case-insensitive
            # and '-'/'_' are interchangeable, so normalise both sides.
            pattern="^$(printf '%s' "$pkg" | sed 's/[-_]/[-_]/g')([[:space:]]|\[|==|$)"
            grep -viE "$pattern" "$RUNNER_TEMP/requirements.txt" > "$RUNNER_TEMP/requirements.filtered" || true
            mv "$RUNNER_TEMP/requirements.filtered" "$RUNNER_TEMP/requirements.txt"
          done
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
        env:
          AUDIT_IGNORE_PACKAGES: ${{ inputs.audit_ignore_packages }}
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        # Only on GitHub-hosted runners. This Docker action builds an image
        # (~minutes) and self-hosted runners already provide Mongo, so skip it
        # there. `runner.environment` reflects the ACTUAL runner, so it is
        # correct even when a self-hosted runner is targeted by custom labels
        # (Linux/X64) that don't contain the literal "self-hosted".
        if: inputs.setup_mongo && runner.environment != 'self-hosted'
      - name: Setup ENV
        run: |
          echo "$env_base64" | base64 -d > .env
          cut -d '=' -f 1 .env | sed '/^\s*$/d'
          cat .env >> "$GITHUB_ENV"
          source .env
        if: ${{ env.env_base64 != '' }}
      - name: run test
        if: inputs.test_script
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          ${{ inputs.test_script }}
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}

  # Merge happens only after the whole build/test job above has finished green,
  # using GITHUB_TOKEN, then explicitly dispatch the caller on main.
  # The caller must enable workflow_dispatch and grant actions: write.
  # Deployment and release processing happen only in the main run.
  automerge:
    # Cancel the same job from an older run on the same branch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-automerge
      cancel-in-progress: true
    name: Automerge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-test-deploy
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      mergeResult: ${{ steps.automerge.outputs.mergeResult }}
    steps:
      # Same contract as the old in-job step (and pascalgn/automerge-action before it):
      # merge open PRs for this commit labelled "automerge" and not "work in progress",
      # and expose mergeResult=merged|skipped|not_merged.
      - name: automerge on PR labelled with automerge
        id: automerge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const REQUIRED = "automerge";
            const BLOCKING = "work in progress";
            const RETRIES = 6;
            const RETRY_SLEEP_MS = 5000;

            let prs;
            if (context.payload.pull_request) {
              // Re-fetch rather than trusting the event payload: for a PR opened by
              // create-pull-request the "opened" event fires before labels are added,
              // so the payload snapshot has labels: [] even when "automerge" is set.
              const { data: fresh } = await github.rest.pulls.get({
                owner, repo, pull_number: context.payload.pull_request.number,
              });
              prs = [fresh];
            } else {
              ({ data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: context.sha,
              }));
            }
            const candidates = prs.filter((pr) => {
              const labels = pr.labels.map((l) => l.name);
              return pr.state === "open" && pr.base.ref === "main" && labels.includes(REQUIRED) && !labels.includes(BLOCKING);
            });
            if (candidates.length === 0) {
              core.info(`No open PR for ${context.sha} labelled "${REQUIRED}"; skipping.`);
              core.setOutput("mergeResult", "skipped");
              return;
            }

            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            let result = "not_merged";
            for (const pr of candidates) {
              for (let attempt = 1; attempt <= RETRIES; attempt++) {
                try {
                  const { data: merge } = await github.rest.pulls.merge({
                    owner, repo, pull_number: pr.number, merge_method: "merge",
                    sha: pr.head.sha,
                  });
                  if (!merge.merged) {
                    throw new Error(`PR #${pr.number} was not merged: ${merge.message}`);
                  }
                  core.info(`Merged PR #${pr.number}`);
                  result = "merged";
                  break;
                } catch (err) {
                  // 405 = not mergeable yet (checks/conflicts), 409 = head moved; retry those.
                  const retryable = err.status === 405 || err.status === 409;
                  core.warning(`PR #${pr.number} merge attempt ${attempt}/${RETRIES} failed: ${err.message}`);
                  if (!retryable || attempt === RETRIES) break;
                  await sleep(RETRY_SLEEP_MS);
                }
              }
            }
            core.setOutput("mergeResult", result);
      - name: Trigger Main CI after merge
        if: steps.automerge.outputs.mergeResult == 'merged'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            // This is the caller's run, not the reusable workflow's file.
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: run.workflow_id, ref: "main",
              });
              core.info(`Dispatched Main CI (workflow ${run.workflow_id}) on main.`);
            } catch (error) {
              core.setFailed(`PR merged, but Main CI dispatch failed: ${error.message}. Enable workflow_dispatch on the caller workflow, grant actions: write, and provide defaults for any required dispatch inputs. Run Main CI manually on main to recover.`);
            }

  release:
    # Cancel the same job from an older run on the same branch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-release
      cancel-in-progress: true
    name: Deploy
    # Same runner selection as build-test-deploy: pick-runner's choice
    # (caller's explicit runs-on respected as-is; otherwise self-hosted with
    # fallback to ubuntu-latest when none is idle).
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Publish/deploy only from Main CI after its build and release processing.
    # !cancelled() allows the automerge dependency to be skipped on main.
    needs: [pick-runner, build-test-deploy, automerge, release-please]
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
      needs.build-test-deploy.result == 'success' && needs.release-please.result == 'success'
    env:
      env_base64: ${{ secrets.env_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          persist-credentials: false
      # Python version resolution: if pyproject.toml declares requires-python,
      # leave python-version empty so uv resolves it from there; otherwise fall
      # back to the python_version workflow input.
      - name: Resolve Python version source
        id: pyver2
        env:
          PYTHON_VERSION_INPUT: ${{ inputs.python_version }}
        run: |
          if [ -f pyproject.toml ] && grep -Eq '^\s*requires-python\s*=' pyproject.toml; then
            echo "pyproject.toml declares requires-python; letting uv resolve it"
            echo "python-version=" >> "$GITHUB_OUTPUT"
          else
            echo "no requires-python found; using fallback python version $PYTHON_VERSION_INPUT"
            echo "python-version=$PYTHON_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ steps.pyver2.outputs.python-version }}
          # Wheel cache keyed on uv.lock; hosted runners only -- self-hosted
          # machines already keep a warm local uv cache, and round-tripping it
          # through the Actions cache would only add transfer time.
          enable-cache: ${{ runner.environment != 'self-hosted' }}
      - name: Setup ENV
        run: |
          echo "$env_base64" | base64 -d > .env
          cut -d '=' -f 1 .env | sed '/^\s*$/d'
          cat .env >> "$GITHUB_ENV"
          source .env
        if: ${{ env.env_base64 != '' }}
      - name: install package
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          make config-test
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: deploy
        if: inputs.deploy_script
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          echo "Registry username: $UV_INDEX_PRIVATE_REGISTRY_USERNAME"
          ${{ inputs.deploy_script }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      # Publish the direct release commit only when a new release was created.
      - name: Release pypi on main branch
        if: inputs.pypi_release && needs.release-please.outputs.release_created == 'true'
        run: |
          make release-s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}

  notify:
    # Cancel the same job from an older run on the same branch.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-notify
      cancel-in-progress: true
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-test-deploy, automerge, release, release-please]
    if: always()
    steps:
      - name: Determine overall result
        id: result
        env:
          BUILD: ${{ needs.build-test-deploy.result }}
          MERGE: ${{ needs.automerge.result }}
          RELEASE: ${{ needs.release.result }}
          RELEASE_PLEASE: ${{ needs.release-please.result }}
        run: |
          stage="CI"; { [ "$RELEASE" != "skipped" ] || [ "$RELEASE_PLEASE" != "skipped" ]; } && stage="Deploy"
          status=success
          for r in "$BUILD" "$MERGE" "$RELEASE" "$RELEASE_PLEASE"; do
            case "$r" in
              failure) status=failure ;;
              cancelled) [ "$status" = success ] && status=cancelled ;;
            esac
          done
          case "$status" in
            success)   title="✅ $stage Succeeded" ;;
            cancelled) title="🚫 $stage Cancelled" ;;
            *)         title="❌ $stage Failed" ;;
          esac
          echo "build=$BUILD automerge=$MERGE release=$RELEASE release-please=$RELEASE_PLEASE -> $title"
          { echo "status=$status"; echo "title=$title"; } >> "$GITHUB_OUTPUT"
      # Python version resolution: if pyproject.toml declares requires-python,
      # leave python-version empty so uv resolves it from there; otherwise fall
      # back to the python_version workflow input.
      - name: Resolve Python version source
        id: pyver3
        env:
          PYTHON_VERSION_INPUT: ${{ inputs.python_version }}
        run: |
          if [ -f pyproject.toml ] && grep -Eq '^\s*requires-python\s*=' pyproject.toml; then
            echo "pyproject.toml declares requires-python; letting uv resolve it"
            echo "python-version=" >> "$GITHUB_OUTPUT"
          else
            echo "no requires-python found; using fallback python version $PYTHON_VERSION_INPUT"
            echo "python-version=$PYTHON_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ steps.pyver3.outputs.python-version }}
          # Wheel cache keyed on uv.lock; hosted runners only -- self-hosted
          # machines already keep a warm local uv cache, and round-tripping it
          # through the Actions cache would only add transfer time.
          enable-cache: ${{ runner.environment != 'self-hosted' }}
      - name: Compose Slack commit summary
        if: always()
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Take the first line only, escape backslashes then double quotes,
          # strip CRs and truncate. Commit messages are attacker-controllable,
          # so this keeps them from breaking out of the JSON payload below.
          MSG="${RAW_COMMIT_MSG%%$'\n'*}"
          MSG="${MSG//\\/\\\\}"
          MSG="${MSG//\"/\\\"}"
          MSG="$(printf '%s' "$MSG" | tr -d '\r')"
          MSG="${MSG:0:160}"
          [ -z "$MSG" ] && MSG="_(no commit message)_"
          printf 'COMMIT_MSG=%s\n' "$MSG" >> "$GITHUB_ENV"
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.slack_webhook_url }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ steps.result.outputs.title }} — ${{ github.repository }}@${{ github.ref_name }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  emoji: true
                  text: "${{ steps.result.outputs.title }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository*\n<https://github.com/${{ github.repository }}|${{ github.repository }}>"
                  - type: "mrkdwn"
                    text: "*Branch*\n`${{ github.ref_name }}`"
                  - type: "mrkdwn"
                    text: "*Author*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Event*\n`${{ github.event_name }}`"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Commit*\n>${{ env.COMMIT_MSG }}"
              - type: "divider"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "Workflow *${{ github.workflow }}*  ·  Run #${{ github.run_number }}  ·  `${{ github.sha }}`"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      emoji: true
                      text: "🔗 View Commit"
                    url: "${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}"
                  - type: "button"
                    text:
                      type: "plain_text"
                      emoji: true
                      text: "📜 View Run"
                    url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify Teams
        if: always()
        env:
          # Prefer the secret; fall back to a repository/org variable of the caller.
          TEAMS_CHANNEL_WEBHOOK_URL: ${{ secrets.teams_webhook_url || vars.TEAMS_CHANNEL_WEBHOOK_URL }}
          TITLE: ${{ steps.result.outputs.title }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$TEAMS_CHANNEL_WEBHOOK_URL" ]; then
            echo "No Teams webhook configured (secret teams_webhook_url / var TEAMS_CHANNEL_WEBHOOK_URL); skipping."
            exit 0
          fi
          # The URL may come from a plain variable (not auto-masked); anyone with
          # it can post to the channel, so keep it out of the logs.
          echo "::add-mask::$TEAMS_CHANNEL_WEBHOOK_URL"
          # Same content as the Slack message, sent as an HTML *text* message rather
          # than an Adaptive Card: the Teams "webhook -> channel" flow posts text
          # messages through the path that gets a notification preview ("Message
          # has no preview" for cards). Built with Python's json module (jq isn't
          # guaranteed on self-hosted runners) so commit messages etc. cannot
          # break the JSON or inject HTML.
          uv run --no-project python - > "$RUNNER_TEMP/teams-payload.json" <<'PY'
          import html, json, os
          e = os.environ
          h = lambda k: html.escape(e.get(k, ""))
          title = e["TITLE"]
          repo_url = f"https://github.com/{h('REPO')}"
          short_sha = h("SHA")[:7]
          if e.get("PR_NUMBER"):
              what = (f"<a href=\"{h('PR_URL')}\">PR #{h('PR_NUMBER')}</a> {h('PR_TITLE')}"
                      f"<br><span style=\"color:#666\">{h('HEAD_REF')} → {h('BASE_REF')}</span>")
              where = f"PR #{e['PR_NUMBER']}"
          else:
              commit = e.get("RAW_COMMIT_MSG", "").splitlines()[0:1]
              commit = html.escape((commit[0] if commit else "").strip()[:160]) or "(no commit message)"
              what = f"<a href=\"{h('COMMIT_URL')}\">{short_sha}</a> {commit}"
              where = e["REF_NAME"]
          summary = f"{title} · {e['REPO']} ({where})"
          text = (
              # Icon only in the message body (the status text lives in the toast summary).
              f"{html.escape(title.split(' ', 1)[0])} <b><a href=\"{repo_url}\">{h('REPO')}</a></b><br>"
              f"{what}<br>"
              f"<span style=\"color:#666\">{h('ACTOR')} · {h('EVENT_NAME')} · "
              f"<a href=\"{h('RUN_URL')}\">{h('WORKFLOW')} #{h('RUN_NUMBER')}</a></span>"
          )
          print(json.dumps({"type": "message", "summary": summary, "text": text}))
          PY
          # (--fail-with-body needs curl >= 7.76, which older runners lack; check status manually.)
          HTTP_CODE=$(curl --silent --show-error -o "$RUNNER_TEMP/teams-response.txt" -w '%{http_code}' \
            -X POST -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/teams-payload.json" "$TEAMS_CHANNEL_WEBHOOK_URL")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Teams webhook returned HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/teams-response.txt"; echo
            exit 1
          fi
          echo "Teams notification sent (HTTP $HTTP_CODE)"
  # Keep the job ID for callers/status consumers; releases no longer use PRs.
  release-please:
    concurrency:
      group: ${{ github.repository }}-direct-release-main
      cancel-in-progress: false
    name: Direct release on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
      needs.build-test-deploy.result == 'success'
    needs: [build-test-deploy]
    outputs:
      release_created: ${{ steps.github_release.outputs.release_created }}
      release_sha: ${{ steps.push.outputs.release_sha }}
    permissions:
      contents: write
    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # GITHUB_TOKEN pushes do not start another CI run.
          token: ${{ github.token }}
          persist-credentials: true
      - name: Verify main has not advanced
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo "::error::main advanced after this build. Release stopped; use the newer Main CI run."
            exit 1
          fi
          git switch -C main "$TESTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Setup release tools
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.12'
      - name: Configure direct release
        env:
          PYPI_RELEASE: ${{ inputs.pypi_release }}
        run: |
          python3 - <<'PYCONFIG'
          import json
          import os
          import tomllib
          from pathlib import Path

          project = Path("pyproject.toml")
          data = tomllib.loads(project.read_text()) if project.exists() else {}
          version_fields = []
          for key, table in (("project.version", data.get("project", {})),
                             ("tool.poetry.version", data.get("tool", {}).get("poetry", {}))):
              if "version" in table:
                  version_fields.append(f"pyproject.toml:{key}")
          if os.environ["PYPI_RELEASE"] == "true" and not version_fields:
              raise SystemExit("Direct package releases require a static project.version or tool.poetry.version in pyproject.toml")
          config = '\n'.join([
              '[semantic_release]',
              'commit_parser = "conventional"',
              'commit_message = "chore(main): release {version} [ci skip]"',
              'commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"',
              'allow_zero_version = true',
              'major_on_zero = false',
              'tag_format = "v{version}"',
              'version_toml = ' + json.dumps(version_fields),
              '[semantic_release.branches.main]',
              'match = "^main$"',
              'prerelease = false',
              '[semantic_release.changelog]',
              'mode = "update"',
              # Do not render templates from the consumer application.
              'template_dir = ".git/direct-release-templates"',
              '[semantic_release.changelog.default_templates]',
              'changelog_file = "CHANGELOG.md"',
          ])
          Path(os.environ["RUNNER_TEMP"], "direct-release.toml").write_text(config + '\n')
          # Preserve the existing Release Please changelog during migration.
          changelog = Path("CHANGELOG.md")
          if changelog.exists() and '<!-- version list -->' not in changelog.read_text():
              changelog.write_text('# CHANGELOG\n\n<!-- version list -->\n\n' + changelog.read_text())
          PYCONFIG
      - name: Prepare version commit and tag locally
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uvx --from python-semantic-release==10.7.0 semantic-release \
            --config "$RUNNER_TEMP/direct-release.toml" \
            version --no-push --no-vcs-release --skip-build
      - name: Push release commit and tag atomically
        id: push
        env:
          NEW_RELEASE: ${{ steps.version.outputs.released }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$NEW_RELEASE" = "true" ]; then
            # No force push: if main moves, neither the commit nor tag is pushed.
            git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Also recover a GitHub Release if an earlier run pushed its tag but
          # failed before creating the GitHub Release.
          if [ -n "$VERSION" ] && [ "$(git tag --points-at HEAD --list "v$VERSION")" = "v$VERSION" ]; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        id: github_release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG: ${{ steps.push.outputs.tag }}
          NEW_RELEASE: ${{ steps.version.outputs.released }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = process.env.TAG;
            core.setOutput("release_created", "false");
            if (!tag) {
              core.info("No releasable changes; deployment may continue without a version bump.");
              return;
            }
            const args = { ...context.repo, tag };
            try {
              await github.rest.repos.getReleaseByTag(args);
              core.setOutput("release_created", process.env.NEW_RELEASE === "true" ? "true" : "false");
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: tag, generate_release_notes: true,
              });
              core.setOutput("release_created", "true");
            }
