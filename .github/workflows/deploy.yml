name: "Deploy"

on:
  workflow_call:
    inputs:
      python_version:
        default: "3.14"
        required: false
        type: string
      deploy_script:
        required: false
        type: string
      aws_region:
        required: false
        default: "ap-southeast-1"
        type: string
      runs-on:
        type: string
        required: false
        default: self-hosted
      timeout-minutes:
        type: number
        required: false
        default: 10
    secrets:
      slack_webhook_url:
        description: "notify slack on github action result"
        required: false
      teams_webhook_url:
        description: "notify Microsoft Teams on github action result (incoming webhook URL)"
        required: false
      aws_key_id:
        required: false
      aws_secret:
        required: false
      env_base64:
        required: false
      pipy_registry_auth:
        required: false


permissions:
  contents: read

jobs:
  deploy:
    name: Pass input and secrets to my-action
    runs-on: "${{ inputs.runs-on }}"
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      env_base64: ${{ secrets.env_base64 }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: View context attributes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: console.log(context)
      - name: Setup ENV
        if: ${{ env.env_base64 != '' }}
        run: echo "$env_base64" | base64 -d > .env && source .env
      - name: print build context
        run: |
          echo "repository = $GH_REPOSITORY"
          echo "ref        = $GH_REF"
          echo "actor      = $GH_ACTOR"
          echo "event      = $GH_EVENT_NAME"
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_ACTOR: ${{ github.actor }}
          GH_EVENT_NAME: ${{ github.event_name }}
      # uv provisions both itself and the Python interpreter on every runner
      # (hosted and self-hosted), so workflows never depend on the machine's Python.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version-file: "pyproject.toml"
      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: |
          echo Hello, world!
          echo github ref: ${{ github.ref }}
      - name: install package
        run: |
          IFS=":" read -r USERNAME PASSWORD <<< "$REGISTRY_AUTH"
          export UV_INDEX_PRIVATE_REGISTRY_USERNAME="$USERNAME"
          export UV_INDEX_PRIVATE_REGISTRY_PASSWORD="$PASSWORD"
          uv venv
          uv pip install .
          uv sync
        env:
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: deploy
        run: ${{ inputs.deploy_script }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.aws_key_id }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.aws_secret }}
          AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
          REGISTRY_AUTH: ${{ secrets.pipy_registry_auth }}
      - name: Compose Slack commit summary
        if: always()
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Take the first line only, escape backslashes then double quotes,
          # strip CRs and truncate. Commit messages are attacker-controllable,
          # so this keeps them from breaking out of the JSON payload below.
          MSG="${RAW_COMMIT_MSG%%$'\n'*}"
          MSG="${MSG//\\/\\\\}"
          MSG="${MSG//\"/\\\"}"
          MSG="$(printf '%s' "$MSG" | tr -d '\r')"
          MSG="${MSG:0:160}"
          [ -z "$MSG" ] && MSG="_(no commit message)_"
          printf 'COMMIT_MSG=%s\n' "$MSG" >> "$GITHUB_ENV"
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.slack_webhook_url }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && '✅' || job.status == 'cancelled' && '🚫' || '❌' }} Deploy ${{ job.status }} — ${{ github.repository }}@${{ github.ref_name }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  emoji: true
                  text: "${{ job.status == 'success' && '✅ Deploy Succeeded' || job.status == 'cancelled' && '🚫 Deploy Cancelled' || '❌ Deploy Failed' }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository*\n<https://github.com/${{ github.repository }}|${{ github.repository }}>"
                  - type: "mrkdwn"
                    text: "*Branch*\n`${{ github.ref_name }}`"
                  - type: "mrkdwn"
                    text: "*Author*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Event*\n`${{ github.event_name }}`"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Commit*\n>${{ env.COMMIT_MSG }}"
              - type: "divider"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "Workflow *${{ github.workflow }}*  ·  Run #${{ github.run_number }}  ·  `${{ github.sha }}`"
              - type: "actions"
                elements:
                  - type: "button"
                    text:
                      type: "plain_text"
                      emoji: true
                      text: "🔗 View Commit"
                    url: "${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}"
                  - type: "button"
                    text:
                      type: "plain_text"
                      emoji: true
                      text: "📜 View Run"
                    url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify Teams
        if: always()
        env:
          # Prefer the secret; fall back to a repository/org variable of the caller.
          TEAMS_CHANNEL_WEBHOOK_URL: ${{ secrets.teams_webhook_url || vars.TEAMS_CHANNEL_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TEAMS_CHANNEL_WEBHOOK_URL" ]; then
            echo "No Teams webhook configured (secret teams_webhook_url / var TEAMS_CHANNEL_WEBHOOK_URL); skipping."
            exit 0
          fi
          # The URL may come from a plain variable (not auto-masked); anyone with
          # it can post to the channel, so keep it out of the logs.
          echo "::add-mask::$TEAMS_CHANNEL_WEBHOOK_URL"
          # Same content as the Slack message, sent as an HTML *text* message rather
          # than an Adaptive Card: the Teams "webhook -> channel" flow posts text
          # messages through the path that gets a notification preview ("Message
          # has no preview" for cards). Built with Python's json module (jq isn't
          # guaranteed on self-hosted runners) so commit messages etc. cannot
          # break the JSON or inject HTML.
          uv run --no-project python - > "$RUNNER_TEMP/teams-payload.json" <<'PY'
          import html, json, os
          e = os.environ
          h = lambda k: html.escape(e.get(k, ""))
          # First line of the commit message, truncated (same rule as the Slack step).
          commit = e.get("RAW_COMMIT_MSG", "").splitlines()[0:1]
          commit = html.escape((commit[0] if commit else "").strip()[:160]) or "<i>(no commit message)</i>"
          title = {
              "success":   "✅ Deploy Succeeded",
              "cancelled": "🚫 Deploy Cancelled",
          }.get(e["STATUS"], "❌ Deploy Failed")
          summary = f"{title} — {e['REPO']}@{e['REF_NAME']}"
          text = (
              f"<b>{html.escape(title)}</b><br>"
              f"<b>Repository:</b> <a href=\"https://github.com/{h('REPO')}\">{h('REPO')}</a>"
              f" &nbsp;·&nbsp; <b>Branch:</b> <code>{h('REF_NAME')}</code>"
              f" &nbsp;·&nbsp; <b>Author:</b> {h('ACTOR')}"
              f" &nbsp;·&nbsp; <b>Event:</b> <code>{h('EVENT_NAME')}</code><br>"
              f"<b>Commit:</b> {commit}<br>"
              f"<small>Workflow <b>{h('WORKFLOW')}</b> · Run #{h('RUN_NUMBER')} · <code>{h('SHA')}</code></small><br>"
              f"🔗 <a href=\"{h('COMMIT_URL')}\">View Commit</a> &nbsp;·&nbsp; "
              f"📜 <a href=\"{h('RUN_URL')}\">View Run</a>"
          )
          print(json.dumps({"type": "message", "summary": summary, "text": text}))
          PY
          # (--fail-with-body needs curl >= 7.76, which older runners lack; check status manually.)
          HTTP_CODE=$(curl --silent --show-error -o "$RUNNER_TEMP/teams-response.txt" -w '%{http_code}' \
            -X POST -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/teams-payload.json" "$TEAMS_CHANNEL_WEBHOOK_URL")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Teams webhook returned HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/teams-response.txt"; echo
            exit 1
          fi
          echo "Teams notification sent (HTTP $HTTP_CODE)"
